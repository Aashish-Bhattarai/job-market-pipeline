# Submission controls (checked in code by batch.py before ANY submit mode):
#   enabled:       master switch — false means nothing is ever submitted.
#   enabled_from:  no submit mode before this date.
#   daily_cap:     max real submissions per calendar day, or null for no
#                  numeric cap. Config-driven, not hardcoded — change the
#                  number here whenever you want, no code involved.
# Dry runs never count and never submit.
submissions:
  enabled: true
  enabled_from: "2026-01-01"
  daily_cap: 50

# Discovery source API keys (free registrations). Missing keys simply skip
# that source with a printed reason — the batch never crashes on them.
# Set via an env var named <SOURCE>_API_KEY (e.g. REED_API_KEY) to avoid ever
# writing a real key into this tracked file -- see SECURITY.md.
sources:
  reed:   {api_key: ""}               # https://www.reed.co.uk/developers

# Model ranks: a stage fails if the model that ACTUALLY answered (after any
# provider fallback) ranks below min_rank. Unknown models rank 0.
# Tiers: long-running stages fall back to a mid-tier model; the intelligence
# stage (auditor) runs the strongest available model.
model_ranks:
  zai/glm-5.3-flash: 1
  anthropic/claude-sonnet-5: 2
  google-antigravity/gemini-3.1-pro: 2
  anthropic/claude-opus-5-5: 3
  zai/glm-5.3: 3

stages:
  requirements:      {model: zai/glm-5.3-flash, thinking: low, min_rank: 1,
                      fallbacks: [anthropic/claude-sonnet-5, google-antigravity/gemini-3.1-pro]}
  classify_question: {model: zai/glm-5.3-flash, thinking: low, min_rank: 1,
                      fallbacks: [anthropic/claude-sonnet-5, google-antigravity/gemini-3.1-pro]}
  map_question:      {model: zai/glm-5.3-flash, thinking: low, min_rank: 1,
                      fallbacks: [anthropic/claude-sonnet-5, google-antigravity/gemini-3.1-pro]}
  base_writer:       {model: zai/glm-5.3-flash, thinking: medium, min_rank: 1,
                      fallbacks: [anthropic/claude-sonnet-5, google-antigravity/gemini-3.1-pro]}
  writer:            {model: anthropic/claude-sonnet-5, thinking: medium, min_rank: 2,
                      fallbacks: [google-antigravity/gemini-3.1-pro]}
  essay:             {model: anthropic/claude-sonnet-5, thinking: medium, min_rank: 2,
                      fallbacks: [google-antigravity/gemini-3.1-pro]}
  # The cheapest capable model writes the human-voiced cover-letter draft; no
  # fallback -- the independent auditor below still checks every sentence.
  cover_human:       {model: zai/glm-5.3-flash, thinking: medium, min_rank: 1, fallbacks: []}
  auditor:           {model: anthropic/claude-opus-5-5, thinking: high, min_rank: 3,
                      fallbacks: [zai/glm-5.3]}
